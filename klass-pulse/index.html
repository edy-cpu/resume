<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Класс.Пульс</title>
<meta name="theme-color" content="#07110f">
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#173d2f,transparent 35%),linear-gradient(#07110f,#050807);color:#f3fff8;font-family:Arial,system-ui,sans-serif}.app{max-width:980px;margin:auto;padding:18px;min-height:100vh}.card,.box{background:#101c18;border:1px solid #2f7a59;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 18px 50px #0007}h1{font-size:42px;margin:0}h2,h3,p{margin:0}.muted{color:#a9c6b6;font-size:14px}.sub{color:#a9c6b6;margin-top:10px;line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}input,select,textarea{width:100%;padding:13px;margin-top:10px;border-radius:14px;border:1px solid #2f7a59;background:#050c0a;color:white;outline:0}textarea{min-height:90px}.btn{border:0;border-radius:14px;padding:12px 16px;margin:8px 6px 0 0;background:#36ff9f;color:#06110f;font-weight:850;cursor:pointer}.btn2{background:#26332e;color:white;border:1px solid #2f7a59}.btn3{background:#a56dff;color:white}.red{background:#ff6070;color:white}.top{position:sticky;top:0;background:#07110fe0;border-bottom:1px solid #2f7a59;z-index:5;margin:-18px -18px 14px;padding:12px 18px}.topin{max-width:980px;margin:auto;display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{display:inline-block;border:1px solid #2f7a59;border-radius:999px;padding:7px 10px;margin:4px;color:#caffdf;background:#10251d;font-weight:800;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.tab{border:0;border-radius:14px;padding:12px;background:#14211d;color:#fff;font-weight:800}.tab.on{background:#36ff9f;color:#06110f}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.warn{border-color:#ffd767;background:#2a230d}.media{height:85px;border:1px dashed #ffffff55;border-radius:16px;display:grid;place-items:center;color:#a9c6b6;margin-top:10px}.modal{position:fixed;inset:0;background:#000b;z-index:20;padding:20px;overflow:auto}.modal .card{max-width:620px;margin:40px auto}.fab{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:70px;height:70px;border-radius:24px;background:#36ff9f;font-size:34px;font-weight:900;border:0}@media(max-width:720px){.grid{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}h1{font-size:34px}.topin,.row{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><div id="app"></div><script>
(function(){
var S={view:'start',tab:'home',modal:null,user:null,klass:null,db:null};
var empty={classes:[],users:[],requests:[],tasks:[],ach:[],chat:[]};
var bad=['драка','побить','ударить','униж','оскорб','опасн','прыгн','лестниц','сломай','подстава'];
function load(){try{S.db=JSON.parse(localStorage.getItem('kp_public_v1')||JSON.stringify(empty))}catch(e){S.db=JSON.parse(JSON.stringify(empty))}['classes','users','requests','tasks','ach','chat'].forEach(function(k){if(!S.db[k])S.db[k]=[]})}
function save(){localStorage.setItem('kp_public_v1',JSON.stringify(S.db))}
function id(p){return p+'_'+Math.random().toString(36).slice(2,9)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function code(n){var b=String(n||'KP').replace(/[^A-Za-zА-Яа-я0-9]/g,'').slice(0,3).toUpperCase()||'KP';return b+'-'+Math.floor(1000+Math.random()*9000)}
function admin(){return S.user&&S.user.role==='admin'}function users(){return S.klass?S.db.users.filter(function(u){return u.classId===S.klass.id&&u.status==='ok'}):[]}
function unsafe(t){t=String(t||'').toLowerCase();return bad.some(function(w){return t.indexOf(w)>=0})}
function start(){return '<main class="app"><section class="card"><h1>Класс.Пульс</h1><p class="sub">Приложение класса: код входа, заявки через админа, задания, чат, ачивки.</p><div class="grid"><div class="box"><h2>Создать класс и код</h2><p class="muted">После создания появится код для одноклассников.</p><form id="create"><input name="className" placeholder="Название класса: 6Б" required><input name="school" placeholder="Школа" required><input name="city" placeholder="Город" required><input name="nick" placeholder="Ник класса" required><input name="name" placeholder="Твоё имя" required><input name="nickname" placeholder="Твой ник" required><button class="btn">Создать класс</button></form></div><div class="box"><h2>Войти в класс</h2><p class="muted">Введи код. Админ должен принять заявку.</p><form id="join"><input name="code" placeholder="Код класса" required><input name="name" placeholder="Твоё имя" required><input name="nickname" placeholder="Твой ник" required><button class="btn btn3">Отправить заявку</button></form></div></div></section></main>'}
function top(){return '<div class="top"><div class="topin"><div><b>'+esc(S.klass.name)+' · '+esc(S.klass.nick)+'</b><p class="muted">Код класса: <b>'+esc(S.klass.code)+'</b></p></div><div><span class="badge">🪙 '+S.user.coins+'</span><span class="badge">'+(admin()?'👑 Админ':'🎒 Ученик')+'</span><button class="btn btn2" id="copy">Скопировать код</button><button class="btn btn2" id="logout">Выйти</button></div></div></div>'}
function tabs(){return '<div class="tabs">'+[['home','Главная'],['tasks','Задания'],['chat','Чат'],['ach','Ачивки'],['profile','Профиль']].map(function(x){return '<button class="tab '+(S.tab===x[0]?'on':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'}
function app(){return '<main class="app">'+top()+tabs()+content()+modal()+'<button class="fab" id="plus">+</button><div style="height:90px"></div></main>'}
function content(){if(S.tab==='tasks')return tasks();if(S.tab==='chat')return chat();if(S.tab==='ach')return ach();if(S.tab==='profile')return profile();return home()}
function home(){var req=S.db.requests.filter(function(r){return r.classId===S.klass.id&&r.status==='wait'}),rev=S.db.tasks.filter(function(t){return t.classId===S.klass.id&&t.status==='review'});var h='<section><div class="card"><h2>Код класса</h2><p class="sub">Одноклассники вводят этот код:</p><h1 style="font-size:34px;color:#36ff9f;margin-top:8px">'+esc(S.klass.code)+'</h1></div><div class="grid"><div class="box"><b>'+users().length+'</b><p class="muted">учеников</p></div><div class="box"><b>'+S.db.tasks.filter(function(t){return t.classId===S.klass.id}).length+'</b><p class="muted">заданий</p></div></div>';if(admin())h+='<div class="card warn"><h2>Проверка админа</h2>'+(req.map(function(r){return '<div class="box"><b>'+esc(r.name)+' / '+esc(r.nick)+'</b><p class="muted">Хочет войти</p><button class="btn okReq" data-id="'+r.id+'">Принять</button><button class="btn red noReq" data-id="'+r.id+'">Отклонить</button></div>'}).join('')||'')+(rev.map(function(t){return '<div class="box"><b>'+esc(t.title)+'</b><p>'+esc(t.text)+'</p><button class="btn okTask" data-id="'+t.id+'">Одобрить</button></div>'}).join('')||'')+(!req.length&&!rev.length?'<p class="muted">Очередь пустая</p>':'')+'</div>';return h+'</section>'}
function tasks(){var a=S.db.tasks.filter(function(t){return t.classId===S.klass.id&&t.status!=='rejected'});return '<section><div class="row"><h2>Задания</h2><button class="btn" id="newTask">Создать</button></div>'+(a.map(function(t){return '<div class="box '+(t.status==='review'?'warn':'')+'"><b>'+esc(t.title)+'</b><p class="muted">'+esc(t.type)+' · '+(t.status==='review'?'на проверке':'активно')+'</p><p>'+esc(t.text)+'</p><div class="media">'+esc(t.media||'медиа')+'</div></div>'}).join('')||'<div class="card"><p class="muted">Заданий пока нет</p></div>')+'</section>'}
function chat(){var a=S.db.chat.filter(function(m){return m.classId===S.klass.id}).slice(-60);return '<section><div class="card"><h2>Чат класса</h2><form id="chatForm"><input name="text" placeholder="Сообщение"><select name="kind"><option>Текст</option><option>Фото</option><option>Видео</option><option>Стикер</option></select><input type="file" name="file" accept="image/*,video/*"><button class="btn">Отправить</button></form><p class="muted">Фото/стикеры показываются превью, видео пока как файл. Для общего видео нужен сервер.</p></div><div class="card">'+(a.map(function(m){return '<div class="box"><b>'+esc(m.nick)+'</b><p>'+esc(m.text)+'</p>'+(m.file?'<p class="muted">Файл: '+esc(m.file)+'</p>':'')+(m.preview?'<img src="'+m.preview+'" style="max-width:180px;border-radius:14px">':'')+'</div>'}).join('')||'<p class="muted">Пока пусто</p>')+'</div></section>'}
function ach(){return '<section><div class="row"><h2>Ачивки</h2><button class="btn" id="newAch">Предложить</button></div>'+(S.db.ach.filter(function(a){return a.classId===S.klass.id}).map(function(a){return '<div class="box"><b>'+(a.approved?'🏆 ':'🗳️ ')+esc(a.title)+'</b><p class="muted">'+esc(a.cond)+'</p><span class="badge">'+a.votes+'/5</span><button class="btn btn2 vote" data-id="'+a.id+'">Голос</button></div>'}).join('')||'<div class="card"><p class="muted">Ачивок пока нет</p></div>')+'</section>'}
function profile(){return '<section><div class="card"><h2>'+esc(S.user.nick)+'</h2><p class="muted">'+esc(S.user.name)+' · '+(admin()?'админ':'ученик')+'</p></div><div class="card"><h2>Ученики</h2>'+users().map(function(u){return '<div class="box"><b>'+esc(u.nick)+'</b><p class="muted">'+esc(u.name)+' · '+u.role+'</p></div>'}).join('')+'</div></section>'}
function modal(){if(!S.modal)return '';var b='';if(S.modal==='task')b='<h2>Создать задание</h2><form id="taskForm"><input name="title" placeholder="Название" required><select name="type"><option>Фотоохота</option><option>Вопрос</option><option>Творчество</option><option>Доброе дело</option><option>Весёлое</option></select><select name="media"><option>Фото</option><option>Видео до 1 минуты</option><option>Кружочек</option><option>Стикер</option></select><textarea name="text" placeholder="Описание" required></textarea><button class="btn">Создать</button></form>';if(S.modal==='ach')b='<h2>Ачивка</h2><form id="achForm"><input name="title" placeholder="Название" maxlength="30" required><textarea name="cond" placeholder="Условие" required></textarea><button class="btn">На голосование</button></form>';return '<div class="modal"><div class="card"><button class="btn btn2" id="close">Закрыть</button>'+b+'</div></div>'}
function bind(){document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){S.tab=b.dataset.tab;render()}});var e;if(e=document.getElementById('create'))e.onsubmit=create;if(e=document.getElementById('join'))e.onsubmit=join;if(e=document.getElementById('logout'))e.onclick=function(){S.view='start';S.user=null;S.klass=null;render()};if(e=document.getElementById('copy'))e.onclick=function(){navigator.clipboard?navigator.clipboard.writeText(S.klass.code).then(function(){alert('Код скопирован: '+S.klass.code)}):alert(S.klass.code)};if(e=document.getElementById('plus'))e.onclick=function(){S.modal='task';render()};if(e=document.getElementById('newTask'))e.onclick=function(){S.modal='task';render()};if(e=document.getElementById('newAch'))e.onclick=function(){S.modal='ach';render()};if(e=document.getElementById('close'))e.onclick=function(){S.modal=null;render()};if(e=document.getElementById('taskForm'))e.onsubmit=newTask;if(e=document.getElementById('achForm'))e.onsubmit=newAch;if(e=document.getElementById('chatForm'))e.onsubmit=sendChat;document.querySelectorAll('.okReq').forEach(function(b){b.onclick=function(){var r=S.db.requests.find(function(x){return x.id===b.dataset.id});if(r){r.status='ok';S.db.users.push({id:id('u'),classId:r.classId,name:r.name,nick:r.nick,role:'student',status:'ok',coins:20});save();render()}}});document.querySelectorAll('.noReq').forEach(function(b){b.onclick=function(){var r=S.db.requests.find(function(x){return x.id===b.dataset.id});if(r)r.status='no';save();render()}});document.querySelectorAll('.okTask').forEach(function(b){b.onclick=function(){var t=S.db.tasks.find(function(x){return x.id===b.dataset.id});if(t)t.status='active';save();render()}});document.querySelectorAll('.vote').forEach(function(b){b.onclick=function(){var a=S.db.ach.find(function(x){return x.id===b.dataset.id});if(a&&a.voters.indexOf(S.user.id)<0){a.voters.push(S.user.id);a.votes++;if(a.votes>=5)a.approved=true;save();render()}}})}
function create(ev){ev.preventDefault();var f=new FormData(ev.target),k={id:id('c'),name:f.get('className'),school:f.get('school'),city:f.get('city'),nick:f.get('nick'),code:code(f.get('className'))},u={id:id('u'),classId:k.id,name:f.get('name'),nick:f.get('nickname'),role:'admin',status:'ok',coins:100};S.db.classes.push(k);S.db.users.push(u);S.db.ach.push({id:id('a'),classId:k.id,title:'Первый в Пульсе',cond:'Создать класс',votes:1,approved:true,voters:[u.id]});S.klass=k;S.user=u;S.view='app';save();render()}
function join(ev){ev.preventDefault();var f=new FormData(ev.target),c=String(f.get('code')).trim().toUpperCase(),k=S.db.classes.find(function(x){return x.code.toUpperCase()===c});if(!k){alert('Класс не найден');return}S.db.requests.push({id:id('r'),classId:k.id,name:f.get('name'),nick:f.get('nickname'),status:'wait'});alert('Заявка отправлена админу');}
function newTask(ev){ev.preventDefault();var f=new FormData(ev.target),txt=f.get('title')+' '+f.get('text');S.db.tasks.unshift({id:id('t'),classId:S.klass.id,title:f.get('title'),text:f.get('text'),type:f.get('type'),media:f.get('media'),status:unsafe(txt)?'review':'active'});S.modal=null;save();render()}
function newAch(ev){ev.preventDefault();var f=new FormData(ev.target);S.db.ach.unshift({id:id('a'),classId:S.klass.id,title:String(f.get('title')).slice(0,30),cond:f.get('cond'),votes:1,approved:false,voters:[S.user.id]});S.modal=null;save();render()}
function sendChat(ev){ev.preventDefault();var f=new FormData(ev.target),file=f.get('file'),m={id:id('m'),classId:S.klass.id,nick:S.user.nick,text:f.get('text'),kind:f.get('kind'),file:file&&file.name?file.name:'',preview:''};if(file&&file.type&&file.type.indexOf('image/')===0&&file.size<1500000){var r=new FileReader();r.onload=function(){m.preview=r.result;S.db.chat.push(m);save();render()};r.readAsDataURL(file);return}S.db.chat.push(m);save();render()}
function render(){document.getElementById('app').innerHTML=S.view==='start'?start():app();bind()}
load();try{render()}catch(e){document.body.innerHTML='<pre style="color:red;padding:20px">'+esc(e.stack||e.message||e)+'</pre>'}
})();
</script></body></html>
